<script>
window.onload = function() {
    var divsObrigado = document.querySelectorAll('.capturar-whatsapp');
    if (divsObrigado.length > 0) {
        divsObrigado.forEach(function(divObrigado) {
            var linksFilhos = divObrigado.querySelectorAll('a');
            if (linksFilhos.length > 0) {
                linksFilhos.forEach(function(linkFilho) {
                    // Adiciona a classe whatsapp ao elemento <a>
                    linkFilho.classList.add('agendar-consulta');
                    // Seleciona todos os descendentes do elemento <a>
                    var descendentes = linkFilho.querySelectorAll('*');
                    // Itera sobre cada descendente
                    descendentes.forEach(function(descendente) {
                        // Adiciona a classe whatsapp a cada descendente
                        descendente.classList.add('agendar-consulta');
                    });
                    console.log('Classe "agendar-consulta" adicionada aos elementos <a> e a todos os seus filhos dentro da div com a classe "capturar-whatsapp" com sucesso.');
                });
            } else {
                console.error('Nenhum filho <a> encontrado dentro da div com a classe "capturar-whatsapp".');
            }
        });
    } else {
        console.error('Nenhuma div com a classe "capturar-whatsapp" encontrada.');
    }
};

document.addEventListener('DOMContentLoaded', function() {
    function adicionarClasseParaElementos(paiClasse, classeAdicional) {
        var divs = document.querySelectorAll(paiClasse);
        if (divs.length > 0) {
            divs.forEach(function(div) {
                // Seleciona todos os elementos filhos dentro da div
                var elementosFilhos = div.querySelectorAll('*');
                if (elementosFilhos.length > 0) {
                    elementosFilhos.forEach(function(filho) {
                        // Adiciona a classe adicional ao elemento
                        filho.classList.add(classeAdicional);
                    });
                    console.log(`Classe "${classeAdicional}" adicionada a todos os elementos dentro da div com a classe "${paiClasse}" com sucesso.`);
                } else {
                    console.error(`Nenhum elemento encontrado dentro da div com a classe "${paiClasse}".`);
                }
            });
        } else {
            console.error(`Nenhuma div com a classe "${paiClasse}" encontrada.`);
        }
    }
		adicionarClasseParaElementos('.capturar-telefone', 'telefone');
});
</script>
